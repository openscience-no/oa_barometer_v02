project:
  type: website
  output-dir: _site
  resources:
    - assets/**

lang: nb

# Vises som "Endret <dato>" på hver side, hentes fra filens endringstidspunkt
date-modified: last-modified

website:
  title: "OA-barometeret"
  favicon: assets/icons/barometer.svg
  navbar:
    title: false
    logo: assets/openscience-logo-hvit.svg
    logo-alt: "openscience.no – åpenforskning.no | openforsking.no"
    logo-href: index.qmd
    background: "#424242"
    foreground: "#ffffff"
    search: true
    left:
      - text: "Nasjonal oversikt"
        href: nasjonal-oversikt.qmd
      - text: "Sektoriell oversikt"
        href: sektoriell-oversikt.qmd
      - text: "Disiplinær oversikt"
        href: disiplinaer-oversikt.qmd
      - text: "Institusjonell oversikt"
        href: institusjonell-oversikt.qmd
      - text: "Metode"
        href: metode.qmd
    right:
      - text: "openscience.no"
        href: https://www.openscience.no
  page-navigation: true
  back-to-top-navigation: true

format:
  html:
    theme: [styles/theme.scss]
    toc: true
    toc-title: "På denne siden"
    toc-depth: 3
    smooth-scroll: true
    link-external-newwindow: true
    title-block-banner: "#E5EDEF"
    title-block-banner-color: "#424242"
    include-after-body: partials/footer.html
    grid:
      sidebar-width: 220px
      body-width: 950px
      margin-width: 220px
      gutter-width: 2rem
